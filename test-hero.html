<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero Test — M. Giridharan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #EBE9E5;
  color: #111;
  font-family: 'Inter', -apple-system, sans-serif;
  overflow-x: hidden;
}

.editorial-hero {
  position: relative;
  width: 100vw;
  height: 100vh;
  min-height: 620px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* Outer giant typography across canvas */
.name-text {
  font-family: 'Inter', sans-serif;
  font-weight: 900;
  font-size: clamp(80px, 14.5vw, 210px);
  line-height: 1;
  letter-spacing: -0.04em;
  white-space: nowrap;
  user-select: none;
  pointer-events: none;
}
.outer-name {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  color: #0A0A0C;
  z-index: 1;
}

/* Floating Editorial Card Frame */
.hero-frame {
  position: relative;
  width: min(92vw, 1040px);
  height: min(84vh, 640px);
  border: 2.5px solid #0A0A0C;
  border-radius: clamp(22px, 3.5vw, 36px);
  background: #1a1816;
  overflow: hidden;
  z-index: 2;
  box-shadow: 0 45px 120px rgba(0, 0, 0, 0.22), 0 14px 40px rgba(0, 0, 0, 0.12);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

/* Background Photo Layer inside the Card */
.frame-backdrop {
  position: absolute;
  inset: 0;
  z-index: 1;
  overflow: hidden;
}
.frame-photo {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 25%;
  transform: scale(1.01);
  transition: transform 1.4s cubic-bezier(.22, .8, .24, 1);
}
.hero-frame:hover .frame-photo {
  transform: scale(1.05);
}

/* Atmospheric gradient overlay for contrast */
.frame-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    180deg,
    rgba(10, 10, 12, 0.52) 0%,
    rgba(10, 10, 12, 0.12) 30%,
    rgba(10, 10, 12, 0.18) 65%,
    rgba(10, 10, 12, 0.78) 100%
  );
  pointer-events: none;
}

/* Inner Name in White */
.inner-name {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  color: #FFFFFF;
  z-index: 3;
  pointer-events: none;
  text-shadow: 0 4px 30px rgba(0, 0, 0, 0.45);
}

/* Header inside card */
.frame-header {
  position: relative;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: clamp(20px, 3vw, 36px) clamp(24px, 4vw, 44px);
  color: #FFFFFF;
}
.frame-brand {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: #FFFFFF;
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
}
.frame-nav {
  display: flex;
  gap: clamp(18px, 2.8vw, 36px);
}
.frame-nav a {
  text-decoration: none;
  color: #FFFFFF;
  font-size: 14px;
  font-weight: 500;
  opacity: 0.9;
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
  transition: opacity .2s, transform .2s;
}
.frame-nav a:hover {
  opacity: 1;
  transform: translateY(-1px);
}

/* Footer inside card */
.frame-footer {
  position: relative;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding: clamp(20px, 3vw, 36px) clamp(24px, 4vw, 44px);
  color: #FFFFFF;
}
.frame-socials {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.frame-socials a {
  color: #FFFFFF;
  text-decoration: none;
  filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.6));
  transition: transform .2s, opacity .2s;
}
.frame-socials a:hover {
  transform: scale(1.15);
  opacity: 1;
}
.frame-role {
  text-align: right;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.frame-role h2 {
  font-size: clamp(18px, 2.5vw, 32px);
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: -0.02em;
  color: #FFFFFF;
  text-shadow: 0 2px 18px rgba(0, 0, 0, 0.7);
}

@media (max-width: 768px) {
  .frame-nav { display: none; }
  .frame-socials { flex-direction: row; }
}
</style>
</head>
